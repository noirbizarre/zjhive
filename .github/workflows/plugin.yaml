name: Zellij plugin
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  wasm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-wasip1
      - run: cargo build --locked -p zjhive --target wasm32-wasip1 --release
      - run: cargo build --locked -p transport-probe --target wasm32-wasip1 --release
      - run: cargo build --locked -p zjhive-bridge --release --target x86_64-unknown-linux-gnu
      - run: python tools/package.py --target x86_64-unknown-linux-gnu
      - uses: actions/upload-artifact@v7
        with:
          name: zjhive-linux-x86_64
          path: dist/*
