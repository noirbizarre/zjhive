
name: 📦 Publish Release

# Dispatched by `gh ship release` on the tag it just created — naming the run
# after it tells the two apart in the Actions run list, where "Publish
# Release" alone would not.
run-name: 📦 Publish Release ${{ inputs.tag }}

on:
  workflow_dispatch:
    inputs:
      tag:
        description: The tag being released
        required: true
        type: string

  workflow_call:
    inputs:
      tag:
        required: true
        type: string

# The upload authenticates as a GitHub App and carries its own permissions.
# These cover `actions/checkout` alone, which only reads.
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # Retries against a flaky registry/network rather than failing a release
  # build outright, and no incremental cache — this is a one-shot build, so
  # there is nothing later to reuse it.
  CARGO_INCREMENTAL: "0"
  CARGO_NET_GIT_FETCH_WITH_CLI: "true"
  CARGO_NET_RETRY: "10"
  RUSTUP_MAX_RETRIES: "10"
  # Same bar CI's clippy job already holds the code to; a release binary
  # should not ship a warning CI would have failed on for anyone else.
  RUSTFLAGS: -D warnings

jobs:
  # Project artifacts extend the generated gh-ship lifecycle; tags/versioning
  # still belong to prepare-release and gh-ship, never this build job.
  publish:
    name: 🚀 Publish
    runs-on: ubuntu-latest
    environment: release
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-wasip1
      - run: cargo build --locked -p zjhive --target wasm32-wasip1 --release
      - run: cargo build --locked -p zjhive-bridge --release --target x86_64-unknown-linux-gnu
      - run: python tools/package.py --target x86_64-unknown-linux-gnu
      - uses: actions/create-github-app-token@v3
        id: app-token
        with:
          client-id: ${{ vars.APP_CLIENT_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
      - name: Attach matching plugin and companion
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          TAG: ${{ inputs.tag }}
        run: gh release upload "$TAG" dist/* --clobber
